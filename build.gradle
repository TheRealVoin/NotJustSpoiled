plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = "${mod_version}-forge-${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            jvmArgs '-Xmx5G', '-Xms2G'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven {
        url 'https://cursemaven.com'
    }

    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Compatibilities
    //implementation fg.deobf("curse.maven:alexs-delight-556448:5028450") // v1.5
    //implementation fg.deobf("curse.maven:deeperdarker-659011:5906086") // v1.3.3
    //implementation fg.deobf("curse.maven:dungeon-and-taverns-853794:5206484") // v3.0.3
    //implementation fg.deobf("curse.maven:dungeons-plus-377794:5026070") // v1.5.0
    //implementation fg.deobf("curse.maven:ends-delight-662675:8374625") // v2.6
    //implementation fg.deobf("curse.maven:oceans-delight-841262:4652060") // v1.0.2
    //implementation fg.deobf("curse.maven:ribbits-622967:7354928") // 3.0.5
    //implementation fg.deobf("curse.maven:simple-delights-recooked-1099025:5703133") // 1.0.0
    //implementation "curse.maven:terralith-513688:5512076" // v2.5.4

    // Compatibilities that must be present at compile time
    compileOnly fg.deobf("curse.maven:alexs-caves-924854:5848216") // v2.0.2
    compileOnly fg.deobf("curse.maven:alexs-mobs-426558:5698791") // v1.22.9
    implementation fg.deobf("curse.maven:dragns-livestock-overhaul-pets-addon-1175609:8129133") // v2.1
    compileOnly fg.deobf("curse.maven:genetic-animals-313213:6134040") // v0.11.12
    compileOnly fg.deobf("curse.maven:simple-farming-327554:4711850") // v2.2.6
    compileOnly fg.deobf("curse.maven:survival-instinct-1242915:7357198") // v1.0.2
    implementation fg.deobf("curse.maven:tough-as-nails-246391:5815863") // v9.2.0.171

    implementation fg.deobf("curse.maven:farmers-delight-398521:8083474")
    implementation fg.deobf("curse.maven:diet-443570:4813904")
    implementation fg.deobf("curse.maven:dragns-livestock-overhaul-1131669:8728287") // v3.9.4

    //implementation fg.deobf("curse.maven:integrated-villages-661376:7830334")
    //implementation fg.deobf("curse.maven:integrated-api-817709:9151117")
    //implementation fg.deobf("curse.maven:supplementaries-412082:9140345")
    //implementation fg.deobf("curse.maven:selene-499980:9178412")
    //implementation fg.deobf("curse.maven:create-328085:7178761")

    // QoL mods for developing
    implementation fg.deobf("curse.maven:appleskin-248787:4770828")
    runtimeOnly fg.deobf("curse.maven:configured-457570:5180900")
    runtimeOnly fg.deobf("curse.maven:jei-238222:7391695")

    // Dependencies for other mods
    runtimeOnly fg.deobf("curse.maven:citadel-331936:7476570")
    runtimeOnly fg.deobf("curse.maven:geckolib-388172:8285794")
    runtimeOnly fg.deobf("curse.maven:glitchcore-955399:5787839")
    runtimeOnly fg.deobf("curse.maven:patchouli-306770:7731017")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.5"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.5")) {
        jarJar.ranged(it, "[0.5.5,)")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,

            mod_id: mod_id,
            mod_name: mod_name,
            mod_logo: mod_logo,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_url: mod_url,
            mod_issues_url: mod_issues_url,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', 'datapack/pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

mixin {
    add sourceSets.main, 'notjustspoiled.refmap.json'
    config 'notjustspoiled.mixins.json'
    config 'notjustspoiled.compat.mixins.json'

    mixin.debug = true
}